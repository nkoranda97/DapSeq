samples:
  TF1:
    r1: null
    r2: null
  TF2:
    r1: null
    r2: null
  input_DNA:
    r1: null
    r2: null

input_control: null
output_dir: null

# genome
genome_ref: null
genome_size: null
gene_annotation: null
aligner: bowtie2    # bowtie2 | bwa_mem2

# compute
threads: 8
slurm_partition: null
slurm_account: null

bbduk:
  adapters: null
  max_frags: null
  mem_gb: 8
  k: 21
  mink: 11
  ktrim: r       # r=right, l=left, lr=both
  qtrim: r       # r=right, l=left, lr=both, w=window
  trimq: 6
  maq: 10
  ow: t          # t=overwrite, f=fail if output exists
  extra: ""

fastqc:
  extra: ""

bowtie2:
  extra: ""
  extra_build: ""

bwa_mem2:
  extra: ""
  extra_index: ""

samtools:
  mapq: 30
  extra_merge: ""

bamcoverage:
  normalize_using: RPGC
  bin_size: 1
  ignore_duplicates: true
  max_fragment_length: 600  # PE only
  extend_reads: true        # PE only
  extra: ""

bamcompare:
  bin_size: 80
  operation: ratio
  scale_factors_method: SES
  n: 1000
  extra: ""

macs3:
  format: BAMPE
  foldch_levels: [2, 5, 15]   # three enrichment filter thresholds; must be strictly increasing
  meme_foldch_level: 2         # 1-based index into foldch_levels for MEME input (1=low, 2=mid, 3=high)
  keep_dup: 1
  extra: ""

# Chromosomes to exclude from peaks before MEME motif analysis.
# Useful for removing viral or decoy sequences (e.g. chrEBV).
# Each excluded chromosome is counted in the log even if absent (zero count, no error).
# chrom_filter:
#   - chrEBV
chrom_filter: []

blacklist_filter:
  enabled: false
  bed: null     # path to blacklist BED/BED.gz (e.g. blacklist/hg38-blacklist.v2.bed.gz); required when enabled: true

complexity_filter:
  enabled: false
  min_entropy: 3.0   

meme:
  nmotifs: 2
  minw: 8
  maxw: 32
  mod: anr
  markov_order: 0
  maxpeaks: 100
  maxsize: 10000000
  summit_extend: 50
  extra: ""

fimo:
  thresh: 1.0e-5
  extra: ""

homer:
  extra: ""

multiqc:
  extra: ""

resources:
  bowtie2_index:
    mem_mb: 64000
    runtime: 60
  bwa_mem2_index:
    mem_mb: 100000
    runtime: 120
  bwa_mem2_align:
    mem_mb: 100000
    runtime: 120
  trim_align:
    mem_mb: 64000
    runtime: 120
  fastqc:
    mem_mb: 32000
    runtime: 30
  multiqc:
    mem_mb: 32000
    runtime: 30
  bowtie2:
    mem_mb: 16000
    runtime: 120
  samtools_filter_sort:
    mem_mb: 64000
    runtime: 60
  bamcoverage:
    mem_mb: 64000
    runtime: 60
  bamcompare:
    mem_mb: 64000
    runtime: 60
  macs3:
    mem_mb: 64000
    runtime: 60
  filter_peaks:
    mem_mb: 64000
    runtime: 10
  blacklist_filter_peaks:
    mem_mb: 8000
    runtime: 10
  narrow_peak_to_fasta:
    mem_mb: 64000
    runtime: 30
  meme:
    mem_mb: 64000
    runtime: 120
  fimo:
    mem_mb: 64000
    runtime: 60
  alignment_stats:
    mem_mb: 64000
    runtime: 30
  sample_stats:
    mem_mb: 64000
    runtime: 60
  qc_summary:
    mem_mb: 64000
    runtime: 10
  update_db:
    mem_mb: 64000
    runtime: 5
  merge_control:
    mem_mb: 64000
    runtime: 60
  homer_annotate:
    mem_mb: 64000
    runtime: 30
  report:
    mem_mb: 64000
    runtime: 30
