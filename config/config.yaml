# control (optional, per-sample): name of another sample to use as this sample's
# MACS3 -c background and bamCompare -b2. Exactly one control per sample; null
# means no background. A sample named as a control by others is peak-called
# against itself and shown as a flagged report row. Different controls on
# different samples run several experiments in one invocation.
# experiment_date / gdna_batch are optional per-sample provenance (free-form).
# tf (optional) is the TF name used to find a Factorbook motif; without it the
# sample name, then its part before the first _ or -, is tried.
# r1/r2 take one path or a list of lane files; PE lanes pair by position.
# Samples come only from your --configfile. No placeholder samples live here:
# Snakemake merges configs key by key, so a default sample would leak its
# fields (e.g. control) into a user sample of the same name.
samples: {}

output_dir: null

# genome
genome_ref: null
# Whole number of bp; plain or scientific notation (e.g. 2700000000 or "2.7e9").
# Required.
genome_size: null
gene_annotation: null
aligner: bowtie2    # bowtie2 | bwa_mem2

# compute
threads: 8

bbduk:
  adapters: null
  max_frags: null
  mem_gb: 8
  k: 21
  mink: 11
  ktrim: r       # r=right, l=left, lr=both
  qtrim: r       # r=right, l=left, lr=both, w=window
  trimq: 6
  maq: 10
  ow: t          # t=overwrite, f=fail if output exists
  extra: ""

fastqc:
  extra: ""

bowtie2:
  extra: ""
  extra_build: ""

bwa_mem2:
  extra: ""
  extra_index: ""

samtools:
  mapq: 30

bamcoverage:
  normalize_using: RPGC
  bin_size: 1
  ignore_duplicates: true
  max_fragment_length: 600  # PE only
  extend_reads: true        # PE only
  extra: ""

bamcompare:
  bin_size: 80
  operation: ratio
  scale_factors_method: SES
  n: 1000
  extra: ""

macs3:
  # null = choose per peak call: BAMPE when the sample and its control are both
  # paired-end, otherwise BAM. Set BAM or BAMPE to force one format for every call.
  format: null
  foldch_levels: [2, 5, 15]   # three enrichment filter thresholds; must be strictly increasing
  meme_foldch_level: 2         # 1-based index into foldch_levels for MEME input (1=low, 2=mid, 3=high)
  keep_dup: 1
  extra: ""

# Chromosomes to exclude from peaks before MEME motif analysis.
# Useful for removing viral or decoy sequences (e.g. chrEBV).
# Each excluded chromosome is counted in the log even if absent (zero count, no error).
# chrom_filter:
#   - chrEBV
chrom_filter: []

# Genome-specific peak filters; off unless your config turns them on.
blacklist_filter:
  enabled: false
  bed: null     # e.g. blacklist/hg38-blacklist.v2.bed.gz (ships with the repo)

rmsk_filter:
  enabled: false
  txt: null     # e.g. a downloaded UCSC rmsk.txt.gz for your genome (not in the repo)

meme:
  nmotifs: 2
  minw: 8
  maxw: 32
  mod: anr
  markov_order: 0
  maxpeaks: 100
  maxsize: 10000000
  summit_extend: 50
  extra: ""

fimo:
  thresh: 1.0e-5
  extra: ""

homer:
  extra: ""

multiqc:
  extra: ""

factorbook:
  tsv: null   # null uses the default path (factorbook/ in repo root)
  meme: null  # null uses the default path

db_path: null  # null uses the default (pipeline_db.db in repo root)

resources:
  bowtie2_index:
    mem_mb: 64000
    runtime: 60
  bwa_mem2_index:
    mem_mb: 64000
    runtime: 120
  bwa_mem2_align:
    mem_mb: 64000
    runtime: 120
  trim_align:
    mem_mb: 64000
    runtime: 120
  fastqc:
    mem_mb: 16000
    runtime: 30
  multiqc:
    mem_mb: 8000
    runtime: 30
  bamcompare:
    mem_mb: 8000
    runtime: 60
  macs3:
    mem_mb: 32000
    runtime: 60
  filter_peaks:
    mem_mb: 8000
    runtime: 10
  blacklist_filter_peaks:
    mem_mb: 8000
    runtime: 10
  rmsk_filter_peaks:
    mem_mb: 8000
    runtime: 30
  narrow_peak_to_fasta:
    mem_mb: 8000
    runtime: 30
  meme:
    mem_mb: 16000
    runtime: 120
  fimo:
    mem_mb: 16000
    runtime: 60
  alignment_stats:
    mem_mb: 8000
    runtime: 30
  sample_stats:
    mem_mb: 8000
    runtime: 60
  update_db:
    mem_mb: 8000
    runtime: 5
  homer_annotate:
    mem_mb: 16000
    runtime: 30
  report:
    mem_mb: 16000
    runtime: 30
