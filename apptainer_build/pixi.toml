[workspace]
channels = ["conda-forge", "bioconda"]
name = "dapseq"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">3.12"
macs3 = ">=3.0.3"
bowtie2 = "*"
bwa-mem2 = "*"
samtools = "*"
deeptools = "*"
meme = "*"
fastqc = "*"
multiqc = "*"
snakemake = ">=9.19.0,<10"
bbmap = "*"
homer = "*"
bedtools = "*"
biopython = "*"
pandas = "*"
ghostscript = ">=10.0"
pillow = ">=10.0.0"

[pypi-dependencies]
# motif logo rendering (logo_utils.py). From PyPI, as in the root env: the
# conda-forge build declares a spurious dependency on the hatch build tool.
logomaker = ">=0.8"
