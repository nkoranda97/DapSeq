# ─────────────────────────────────────────────────────────────────────────────
# DAP-seq pipeline configuration
# ─────────────────────────────────────────────────────────────────────────────

author: "Your Name"

# rename sample_name to name sample will be identified as
# Use full paths to the raw data for r1 and r2
# If SE, leave r2 as null
# r1/r2 may be a list of lane files, e.g. r1: [/path/L1_R1.fq.gz, /path/L2_R1.fq.gz];
# PE lanes pair by position, so r1 and r2 need the same number of files.
# add as many samples as you'd like
#
# control (optional, per-sample): name of another sample to use as this sample's
# MACS3 -c background and bamCompare -b2. Exactly one control per sample; leave
# as null to peak-call this sample with no background. A sample named as a
# control by others is peak-called against itself (QC self peak-call and an
# against-itself run through the full treatment pipeline) and appears as a
# flagged row in the report. Assign different controls to different samples to
# run several experiments in one pipeline invocation.
#
# tf is optional: the TF name used to look up a reference motif in Factorbook
# (ENCODE human ChIP-seq). Without it, the sample name is tried, then its part
# before the first _ or - (CTCF_rep1 -> CTCF). Unmatched samples get no logo.
#
# experiment_date / gdna_batch are optional per-sample provenance. They appear
# as columns in the HTML report and are stored per-sample in the results
# database. Leave as null to omit.

samples:
  # ── Experiment A ──
  TF_A:
    r1: null
    r2: null
    control: input_A        # uses input_A as its background
    experiment_date: null   # optional, e.g. "2026-07-14" (free-form string)
    gdna_batch: null        # optional, e.g. "batch-07" (free-form string)

  input_A:
    r1: null
    r2: null
    control: null           # a control names no control of its own
    experiment_date: null
    gdna_batch: null

  # ── Experiment B (runs in the same pipeline invocation) ──
  TF_B:
    r1: null
    r2: null
    control: input_B
    experiment_date: null
    gdna_batch: null

  input_B:
    r1: null
    r2: null
    control: null
    experiment_date: null
    gdna_batch: null

# please put output folder in a directory outside of the pipeline folder
output_dir: null

# ── Genome ───────────────────────────────────────────────────────────────────
# full path to fasta file
genome_ref: null

# Effective genome size: the part of the genome reads can map to, not the
# assembly length. MACS3 uses it as -g and bamCoverage for RPGC scaling, so a
# wrong value skews peak calls and coverage tracks. It cannot be larger than the
# reference; the run warns when it is. Typical values and how to choose one:
# README, "Choosing genome_size". Plain or scientific notation ("1.19e8").
# Required.
genome_size: null

# Path to GTF/GFF for HOMER annotatePeaks. Set to null to skip annotation.
# full path to gtf
gene_annotation: null

aligner: bowtie2  # bowtie2 | bwa_mem2

# ── Optional overrides ───────────────────────────────────────────────────────
# Every other setting comes from config/config.yaml. Copy a key here only to
# change it; the README options table lists them all. Values shown are the
# current defaults.
#
# threads: 8
#
# macs3:
#   foldch_levels: [2, 5, 15]   # three enrichment thresholds, strictly increasing
#   meme_foldch_level: 2        # which of them feeds MEME/FIMO (1-3)
#
# meme:
#   nmotifs: 2
#   maxpeaks: 100               # top peaks by fold-change written for MEME/FIMO
#
# fimo:
#   thresh: 1.0e-5
#
# chrom_filter: []              # e.g. [ChrC, ChrM]: chromosomes kept out of MEME
#
# blacklist_filter:
#   enabled: false
#   bed: /path/to/blacklist.bed.gz
#
# rmsk_filter:
#   enabled: false
#   txt: /path/to/rmsk.txt.gz
#
# bbduk:
#   max_frags: null             # subsample each sample to this many fragments
#
# db_path: /absolute/path/to/pipeline_db.db   # default: pipeline_db.db in the repo root
#
# resources:                    # per-rule SLURM limits; defaults suit the cluster
#   meme:
#     mem_mb: 16000
#     runtime: 120
