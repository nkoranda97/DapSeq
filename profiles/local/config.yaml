# Snakemake profile for local (non-SLURM) execution.
# Run with: pixi run snakemake --profile profiles/local --configfile /path/to/config.yaml

# Run every rule inside the Apptainer container (same SIF as HPC).
# Build the SIF once with:
#   pixi run apptainer build apptainer_build/dapseq.sif apptainer_build/dapseq.def
use-apptainer: true

# No apptainer-args: the HPC bind paths (/project/...) don't exist locally.

# Conservative parallel-job limit for a workstation; override with --jobs N.
jobs: 4

# Resource hints — same keys as the default profile so per-rule declarations resolve.
default-resources:
  mem_mb: 8000
  runtime: 120          # minutes
