executor: slurm

# jobscript runs before every SLURM job — loads Apptainer module
jobscript: "profiles/slurm/slurm-jobscript.sh"

# Maximum number of jobs submitted to SLURM at once
jobs: 100

# Run every rule inside the container declared in the Snakefile
use-apptainer: true

# Bind your HPC project directory so data paths outside $HOME are visible in
# the container. Replace /project/FILL_IN with your lab's project path
# (e.g. /project/pi-yourlab). List multiple paths as comma-separated values.
apptainer-args: "--bind /project/FILL_IN"

# Default SLURM resources used when a rule does not specify its own.
# Set slurm_partition and slurm_account to your cluster values before first use.
default-resources:
  mem_mb: 8000
  runtime: 120          # minutes
  slurm_partition: "FILL_IN"    # e.g. caslake
  slurm_account: "FILL_IN"      # e.g. pi-yourlab
