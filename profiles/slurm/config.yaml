executor: slurm

# Run `module load apptainer` before `snakemake` (see README): the SLURM
# executor submits with `sbatch --export=ALL --wrap`, so jobs inherit that
# environment. It does not use a custom jobscript.

# Maximum number of jobs submitted to SLURM at once
jobs: 100

# Run every rule inside the container declared in the Snakefile
use-apptainer: true

# Bind your HPC project directories so data paths outside $HOME are visible in
# the container. Give one --bind with comma-separated paths (no spaces), e.g.
# "--bind /project/pi-yourlab,/scratch/yourlab".
apptainer-args: "--bind /project/zhuzhuzhang,/project/gzy8899"

# Default SLURM resources used when a rule does not specify its own.
# Set slurm_partition and slurm_account to your cluster values before first use.
default-resources:
  mem_mb: 8000
  runtime: 120          # minutes
  slurm_partition: "caslake"    # e.g. caslake
  slurm_account: "pi-zhuzhuzhang"      # e.g. pi-yourlab
