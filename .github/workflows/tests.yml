name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          # The pixi that last re-locked pixi.lock. Any pixi from 0.68 reads its
          # lock format (v7); the container builds with its own pinned 0.81.
          pixi-version: v0.84.2
          locked: true
      - run: pixi run test
