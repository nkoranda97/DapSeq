name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          # Reads pixi.lock (format v7). The container image pins its own pixi
          # (0.81, apptainer_build/dapseq.def) for apptainer_build/pixi.lock.
          pixi-version: v0.84.2
          locked: true
      - run: pixi run test
